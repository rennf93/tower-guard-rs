# SMOKE_PORT overrides the host port (8080 default) so the stack can run
# alongside other services; the live-smoke workflow uses the default.
services:
  simple-app:
    build:
      context: ../..
      dockerfile: examples/simple_app/Dockerfile
      additional_contexts:
        # Sibling engine checkout; CI places one at ../guard-core-rs.
        engine: ../../../guard-core-rs
    image: tower-guard-rs-simple-app:local
    ports:
      - "${SMOKE_PORT:-8080}:8080"
    environment:
      - APP_ADDR=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
